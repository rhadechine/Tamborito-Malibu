; PgBouncer — sección 31.1 del documento de arquitectura.
;
; Este archivo SÍ se monta y SÍ se usa (ver el servicio `pgbouncer` en
; `docker-compose.yml`): la imagen `edoburu/pgbouncer` solo genera su propio
; `pgbouncer.ini` a partir de variables de entorno cuando el archivo no
; existe ya en `/etc/pgbouncer/pgbouncer.ini` (ver `entrypoint.sh` de la
; imagen). Antes de este cambio no se montaba ningún `.ini` propio, así que
; la imagen generaba el suyo y TODO lo de aquí abajo —`reserve_pool_size`,
; `admin_users = tamborito`, `stats_users`— se ignoraba en silencio; el admin
; console real quedaba con `admin_users = postgres`, un usuario sin entrada
; en `userlist.txt`, es decir: inaccesible.

[databases]
tamborito = host=postgres port=5432 dbname=tamborito

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; La imagen corre como el usuario `postgres` (uid 70) sin privilegios de
; root — no puede hacer setuid a otro usuario, así que no se fija `user =`
; aquí (fijarlo revienta el arranque con "cannot force uid pgbouncer").
unix_socket_dir =

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Modo transaction pooling: cada transacción toma una conexión física del
; pool y la libera al terminar. Django corre con CONN_MAX_AGE = 0 porque el
; pooling real ocurre aquí, no en el proceso de Django (ver
; `config/settings/base.py`).
pool_mode = transaction

max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

; Mismo usuario que ya tiene entrada en userlist.txt — con `admin_users =
; postgres` (el default de la imagen) el admin console quedaba inalcanzable
; porque userlist.txt nunca tuvo credenciales para `postgres`.
admin_users = tamborito
stats_users = tamborito

; Directorios ya presentes y escribibles por el usuario `postgres` en la
; imagen (`/var/log/pgbouncer`, `/var/run/pgbouncer`) — verificado con
; `docker exec ... ls -la /var/log /var/run`.
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
