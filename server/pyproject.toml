[project]
name = "tamborito-backend"
version = "0.1.0"
description = "Backend de la plataforma Fundación Tamborito + Museo Arqueológico Malibú"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.67",
    "celery>=5.6.3",
    "django>=5.0,<5.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "ruff>=0.16.2",
]
